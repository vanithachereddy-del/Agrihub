<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Farmer Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="profile">
<div id="site-header"></div>
<main class="page-shell">
    <div class="container">
        <header class="page-header">
            <span class="page-eyebrow">My Account</span>
            <h1 class="page-title">Farmer Profile</h1>
            <p class="page-subtitle">Manage your personal and farm details.</p>
        </header>

        <div id="profileGuest" class="content-card text-center py-5">
            <p class="text-muted mb-3" data-i18n="profile.guest">Please login or register to view your profile.</p>
            <a href="login.html" class="btn btn-success me-2" data-i18n="auth.login">Farmer Login</a>
            <a href="register.html" class="btn btn-outline-success" data-i18n="auth.register">Register as Farmer</a>
        </div>

        <div class="content-card">
            <form id="profileForm" class="d-none">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="fullName" required></div>
                    <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div>
                    <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
                    <div class="col-md-6"><label class="form-label">Village</label><input class="form-control" name="village"></div>
                    <div class="col-md-6"><label class="form-label">Farm Size</label><input class="form-control" name="farmSize" placeholder="e.g. 5 acres"></div>
                    <div class="col-md-6"><label class="form-label">Crops (comma separated)</label><input class="form-control" name="crops" placeholder="Rice, Tomato"></div>
                    <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="2"></textarea></div>
                    <div class="col-12"><button class="btn btn-success">Save Profile</button></div>
                </div>
            </form>
        </div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
