<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Farmer Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
<div id="site-header"></div>
<main class="login-shell">
    <div class="login-card">
        <span class="page-eyebrow">Farmer Access</span>
        <h2 class="page-title">Farmer Login</h2>
        <p class="page-subtitle mb-4">Demo: ramesh@farmer.com / farmer123</p>
        <form id="loginForm">
            <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
            <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
            <button class="btn btn-success w-100">Login</button>
        </form>
        <div class="mt-3 text-muted small">New farmer? <a href="register.html">Register here</a>.</div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
