<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="orders">
<div id="site-header"></div>
<main class="page-shell">
    <div class="container">
        <header class="page-header">
            <span class="page-eyebrow">Checkout</span>
            <h1 class="page-title">Cart &amp; Orders</h1>
            <p class="page-subtitle">Add products, place orders and track delivery status.</p>
        </header>
        <div class="split-layout two-col">
            <section>
                <div class="content-card mb-4 cart-panel">
                    <h4 class="fw-bold mb-3">Your Cart</h4>
                    <div id="cartSummary"></div>
                </div>
                <h5 class="fw-bold mb-3">Quick Add Products</h5>
                <div id="orderProducts" class="row g-3"></div>
            </section>
            <aside>
                <div class="content-card mb-4">
                    <h4 class="fw-bold mb-3">Checkout</h4>
                    <form id="orderForm">
                        <div class="mb-3"><input class="form-control" name="customerName" placeholder="Full name" required></div>
                        <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
                        <div class="mb-3"><input class="form-control" name="phone" placeholder="Phone"></div>
                        <div class="mb-3"><textarea class="form-control" name="shippingAddress" rows="3" placeholder="Shipping address / Village"></textarea></div>
                        <div class="mb-3">
                            <select class="form-select" name="paymentMethod">
                                <option value="Cash on Delivery">Cash on Delivery</option>
                                <option value="UPI">UPI</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                            </select>
                        </div>
                        <button class="btn btn-success w-100">Place Order</button>
                    </form>
                </div>
                <div class="content-card">
                    <h4 class="fw-bold mb-3">Order History &amp; Tracking</h4>
                    <div id="orderHistory"></div>
                </div>
            </aside>
        </div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
