<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Disease Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="disease">
<div id="site-header"></div>
<main class="page-shell">
    <div class="container">
        <header class="page-header">
            <span class="page-eyebrow">AI Assistant (Placeholder)</span>
            <h1 class="page-title">Crop Disease Detection</h1>
            <p class="page-subtitle">Upload a crop image to receive a preliminary diagnosis. Replace the backend service with a real ML model for production use.</p>
        </header>
        <div class="split-layout equal-col">
            <div class="content-card">
                <form id="diseaseForm">
                    <div class="mb-3">
                        <label for="imageUpload" class="form-label fw-semibold">Upload crop image</label>
                        <input class="form-control" type="file" id="imageUpload" accept="image/*" required>
                    </div>
                    <img id="imagePreview" class="preview-img d-none" alt="Preview">
                    <button class="btn btn-success w-100">Analyze Image</button>
                </form>
            </div>
            <div class="content-card" id="predictionCard">
                <h4 class="fw-bold">Prediction Result</h4>
                <p class="text-muted mb-0">Upload an image and click Analyze to see AI prediction, recommended treatments and prevention tips.</p>
            </div>
        </div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
