<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Crop Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="crop-recommend">
<div id="site-header"></div>
<main class="page-shell">
    <div class="container">
        <header class="page-header">
            <span class="page-eyebrow" data-i18n="cropRec.eyebrow">Rule-Based Guidance (Not ML Accuracy)</span>
            <h1 class="page-title" data-i18n="cropRec.title">Crop Recommendation</h1>
            <p class="page-subtitle" data-i18n="cropRec.subtitle">Tell us about your farm and get the top 3 crops best suited to your conditions, with a suitability score and the reasons behind it.</p>
        </header>
        <div class="split-layout equal-col">
            <div class="content-card">
                <form id="cropRecForm">
                    <div class="mb-3">
                        <label for="recSoilType" class="form-label fw-semibold" data-i18n="cropRec.soilType">Soil Type</label>
                        <select class="form-select" id="recSoilType" required>
                            <option value="">-- select --</option>
                            <option>Clay</option>
                            <option>Loamy</option>
                            <option>Loam</option>
                            <option>Clay Loam</option>
                            <option>Sandy Loam</option>
                            <option>Black soil</option>
                            <option>Red soil</option>
                            <option>Sandy</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="recSeason" class="form-label fw-semibold" data-i18n="cropRec.season">Season</label>
                        <select class="form-select" id="recSeason" required>
                            <option value="">-- select --</option>
                            <option>Kharif</option>
                            <option>Rabi</option>
                            <option>Zaid</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="recWater" class="form-label fw-semibold" data-i18n="cropRec.water">Water Availability</label>
                        <select class="form-select" id="recWater" required>
                            <option value="">-- select --</option>
                            <option>Low</option>
                            <option>Medium</option>
                            <option>High</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="recLocation" class="form-label fw-semibold" data-i18n="cropRec.location">Farm Location (optional)</label>
                        <div class="d-flex gap-2">
                            <input type="text" class="form-control" id="recLocation" placeholder="Village/Town, District, State (e.g. Mylavaram, NTR District, Andhra Pradesh)">
                            <button type="button" id="estimateWaterBtn" class="btn btn-outline-success text-nowrap" data-i18n="cropRec.estimateWater">📍 Estimate Water</button>
                        </div>
                        <div id="waterEstimateInfo" class="small mt-2"></div>
                    </div>
                    <div class="mb-3">
                        <label for="recPrevCrop" class="form-label fw-semibold" data-i18n="cropRec.prevCrop">Previous Crop (optional)</label>
                        <input type="text" class="form-control" id="recPrevCrop" placeholder="e.g. Rice">
                    </div>
                    <div class="mb-3">
                        <label for="recIrrigation" class="form-label fw-semibold" data-i18n="cropRec.irrigation">Irrigation Source (optional)</label>
                        <select class="form-select" id="recIrrigation">
                            <option value="">-- select --</option>
                            <option>Canal</option>
                            <option>Borewell</option>
                            <option>Rainfed</option>
                            <option>Tank</option>
                            <option>Drip</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6 col-md-3">
                            <label for="recPh" class="form-label fw-semibold small" data-i18n="cropRec.ph">pH (opt.)</label>
                            <input type="number" step="0.1" min="0" max="14" class="form-control" id="recPh">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="recN" class="form-label fw-semibold small" data-i18n="cropRec.n">N (opt.)</label>
                            <input type="number" step="0.1" class="form-control" id="recN">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="recP" class="form-label fw-semibold small" data-i18n="cropRec.p">P (opt.)</label>
                            <input type="number" step="0.1" class="form-control" id="recP">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="recK" class="form-label fw-semibold small" data-i18n="cropRec.k">K (opt.)</label>
                            <input type="number" step="0.1" class="form-control" id="recK">
                        </div>
                    </div>
                    <button class="btn btn-success w-100" data-i18n="cropRec.submit">Get Recommendations</button>
                </form>
            </div>
            <div class="content-card" id="cropRecResult">
                <h4 class="fw-bold" data-i18n="cropRec.resultTitle">Recommended Crops</h4>
                <p class="text-muted mb-0" data-i18n="cropRec.resultHint">Fill in the form and submit to see your top 3 recommended crops.</p>
            </div>
        </div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
