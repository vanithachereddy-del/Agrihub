<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Fertilizer Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="calculator">
<div id="site-header"></div>
<main class="page-shell">
    <div class="container">
        <header class="page-header">
            <span class="page-eyebrow">Smart Tools</span>
            <h1 class="page-title" data-i18n="calc.title">Fertilizer Calculator</h1>
            <p class="page-subtitle" data-i18n="calc.subtitle">Get fertilizer recommendations based on crop and land area.</p>
        </header>
        <div class="split-layout equal-col">
            <div class="content-card">
                <form id="calcForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="calc.selectCrop">Select Crop</label>
                        <select id="calcCrop" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" data-i18n="calc.landArea">Land Area (Acres)</label>
                        <input type="number" id="calcAcres" class="form-control" min="0.1" step="0.1" value="1" required>
                    </div>
                    <button class="btn btn-success w-100" data-i18n="calc.calculate">Calculate</button>
                </form>
            </div>
            <div class="content-card" id="calcResult">
                <h4 class="fw-bold" data-i18n="calc.result">Recommendation</h4>
                <p class="text-muted mb-0">Select a crop and enter land area to get fertilizer recommendations.</p>
            </div>
        </div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
