<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Farmer Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
<div id="site-header"></div>
<main class="login-shell">
    <div class="login-card" style="width:min(100%,560px)">
        <span class="page-eyebrow">Join AgriHub</span>
        <h2 class="page-title">Farmer Registration</h2>
        <p class="page-subtitle mb-4">Create your account to access products, orders and expert support.</p>
        <form id="registerForm">
            <div class="row g-3">
                <div class="col-md-6"><input class="form-control" name="fullName" placeholder="Full name" required></div>
                <div class="col-md-6"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
                <div class="col-md-6"><input class="form-control" name="phone" placeholder="Phone" required></div>
                <div class="col-md-6"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
                <div class="col-md-6"><input class="form-control" name="village" placeholder="Village"></div>
                <div class="col-md-6"><input class="form-control" name="farmSize" placeholder="Farm size (e.g. 3 acres)"></div>
                <div class="col-12"><input class="form-control" name="crops" placeholder="Crops (comma separated)"></div>
                <div class="col-12"><input class="form-control" name="address" placeholder="Address"></div>
                <div class="col-12"><button class="btn btn-success w-100">Register</button></div>
            </div>
        </form>
        <div class="mt-3 text-muted small">Already registered? <a href="login.html">Login here</a>.</div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
