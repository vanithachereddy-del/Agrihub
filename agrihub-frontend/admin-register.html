<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Shop Owner Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin-register">
<div id="site-header"></div>
<main class="login-shell">
    <div class="login-card" style="width:min(100%, 750px)">
        <span class="page-eyebrow">Shop Owner</span>
        <h2 class="page-title">Admin Registration</h2>
        <p class="page-subtitle mb-4">Register your shop on AgriHub to sell products, manage orders and help farmers.</p>
        <form id="adminRegisterForm">
            <h5 class="fw-bold mb-3 text-success">1. Personal Information</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input class="form-control" name="fullName" placeholder="Enter owner's full name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input class="form-control" name="email" type="email" placeholder="Enter personal/shop email" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Contact Phone</label>
                    <input class="form-control" name="phone" placeholder="Enter contact number" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Password</label>
                    <input class="form-control" name="password" type="password" placeholder="Create password" required>
                </div>
            </div>

            <h5 class="fw-bold mb-3 text-success">2. Shop Details</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Shop Name</label>
                    <input class="form-control" name="shopName" placeholder="Enter registered shop name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Shop Contact Phone</label>
                    <input class="form-control" name="shopPhone" placeholder="Enter shop phone number" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Shop Category</label>
                    <select class="form-select" name="shopCategory" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Fertilizers">Fertilizers</option>
                        <option value="Pesticides">Pesticides</option>
                        <option value="Seeds">Seeds</option>
                        <option value="Irrigation & Tools">Irrigation & Tools</option>
                        <option value="General Store">General Agri-Store</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">GSTIN / License Number</label>
                    <input class="form-control" name="licenseNumber" placeholder="Enter GST or License Number" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Shop Address</label>
                    <textarea class="form-control" name="shopAddress" rows="2" placeholder="Enter complete shop address" required></textarea>
                </div>
            </div>

            <div class="col-12 mt-4">
                <button class="btn btn-success w-100 py-2.5 fw-bold">Register Shop & Login</button>
            </div>
        </form>
        <div class="mt-3 text-muted small">Already registered? <a href="admin-login.html">Admin Login here</a>.</div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
