<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Ask Expert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="expert">
<div id="site-header"></div>
<main class="page-shell">
    <div class="container">
        <header class="page-header">
            <span class="page-eyebrow">Expert Help</span>
            <h1 class="page-title">Ask an Agricultural Expert</h1>
            <p class="page-subtitle">Submit your crop problem with details. Shop owner will review and reply.</p>
        </header>
        <div class="split-layout equal-col">
            <div class="content-card">
                <form id="expertForm">
                    <div class="mb-3"><input class="form-control" name="farmerName" placeholder="Your name" required></div>
                    <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
                    <div class="mb-3"><input class="form-control" name="phone" placeholder="Phone"></div>
                    <div class="mb-3"><input class="form-control" name="crop" placeholder="Crop (e.g. Tomato)"></div>
                    <div class="mb-3"><textarea class="form-control" name="question" rows="4" placeholder="Describe your issue" required></textarea></div>
                    <div class="mb-3"><input class="form-control" name="imageUrl" placeholder="Image URL (optional)"></div>
                    <button class="btn btn-success w-100">Submit Request</button>
                </form>
            </div>
            <div class="content-card">
                <h4 class="fw-bold mb-3">Your Expert Requests</h4>
                <div id="expertRequestsList"></div>
            </div>
        </div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
