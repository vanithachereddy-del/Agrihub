<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="products">
<div id="site-header"></div>
<main class="page-shell">
    <div class="container">
        <header class="page-header">
            <span class="page-eyebrow">Marketplace</span>
            <h1 class="page-title">Farming Essentials</h1>
            <p class="page-subtitle">Search fertilizers, pesticides, seeds and irrigation products.</p>
        </header>

        <div class="search-wrap position-relative mb-3">
            <div class="input-group">
                <input id="searchInput" type="text" class="form-control" data-i18n-placeholder="home.searchPlaceholder" placeholder="Search by name, brand or category">
                <button id="searchButton" class="btn btn-success"><i class="bi bi-search"></i> <span data-i18n="common.search">Search</span></button>
            </div>
            <div id="productsSearchDropdown" class="search-dropdown d-none"></div>
        </div>

        <div class="filter-pills">
            <button class="filter-pill active" data-category="">All</button>
            <button class="filter-pill" data-category="Fertilizers">Fertilizers</button>
            <button class="filter-pill" data-category="Pesticides">Pesticides</button>
            <button class="filter-pill" data-category="Seeds">Seeds</button>
            <button class="filter-pill" data-category="Irrigation">Irrigation</button>
        </div>

        <div id="productList" class="row g-4"></div>
    </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
