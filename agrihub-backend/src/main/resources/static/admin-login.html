<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriHub | Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin-login">
<main class="login-shell">
    <div class="login-card">
        <span class="page-eyebrow">Shop Owner</span>
        <h2 class="page-title">Admin Login</h2>
        <p class="page-subtitle mb-4">Demo: admin@agrihub.com / admin123</p>
        <form id="adminLoginForm">
            <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Admin email" required></div>
            <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
            <button class="btn btn-success w-100">Login to Dashboard</button>
        </form>
        <div class="mt-3 text-muted small">
            New shop owner? <a href="admin-register.html">Register here</a>.<br>
            <a href="index.html" class="d-inline-block mt-2">&larr; Back to Home</a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/features.js"></script>
<script src="js/app.js"></script>
</body>
</html>
