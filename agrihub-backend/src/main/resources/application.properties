spring.application.name=agrihub-backend

# MongoDB connection
spring.data.mongodb.uri=mongodb://localhost:27017/AgriHub

# File upload limits for disease detection & expert images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server port
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=framework

# --- Weather-based water availability estimate (Open-Meteo, no API key needed) ---
# These are PROTOTYPE decision thresholds for classifying combined recent+forecast
# rainfall (mm) into Low/Medium/High. They are NOT validated agronomic standards -
# tune them per region/crop as needed. combinedRainfallMm <= low-max-mm => Low;
# <= medium-max-mm => Medium; above that => High.
agrihub.weather.rainfall.low-max-mm=30
agrihub.weather.rainfall.medium-max-mm=90
# Number of past days of rainfall to sum (historical archive)
agrihub.weather.rainfall.recent-days=7
# Number of upcoming days of rainfall to sum (forecast)
agrihub.weather.rainfall.forecast-days=5

# --- Crop Calendar weather-adaptive advisories ---
# PROTOTYPE decision thresholds for demonstration - NOT validated universal
# agronomic/meteorological standards. Tune per crop, region and local
# agricultural extension guidance.
agrihub.cropcalendar.rain-warning-mm=10
agrihub.cropcalendar.heavy-rain-mm=30
agrihub.cropcalendar.high-temperature-c=38
agrihub.cropcalendar.strong-wind-kmh=25
# How many days of Open-Meteo forecast to fetch (free tier supports up to 16)
agrihub.cropcalendar.forecast-window-days=16
# When a weather-sensitive activity hits a bad day, how many days ahead to
# search for a better alternative day
agrihub.cropcalendar.reschedule-lookahead-days=5
